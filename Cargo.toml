[package]
name = "openresquesim_server"
version = "2.2.0"
edition = "2021"
description = "OpenRescueSim Server: Kamera-Aufzeichnung, Live-Stream, Marker und Debriefing für Einsatz-Simulationstraining"


[package.metadata.deb]
name = "openresquesim-server"
maintainer = "OpenRescueSim-Projekt <noreply@openrescuesim.invalid>"
license-file = "LICENSE"
section = "video"
priority = "optional"
extended-description = """\
Nimmt Kameras und Mikrofone im Übungsraum auf, zeigt das Bild live auf
Zuschauer-Bildschirmen, erlaubt Marker und Durchsagen während der Übung und stellt
alles fürs Debriefing bereit. Läuft im lokalen Netz, Bedienung im Browser.
Die Installation fragt Port, HTTPS und Firewall ab und richtet den Dienst ein."""
maintainer-scripts = "debian/"
recommends = "avahi-daemon, alsa-utils"
depends = "debconf (>= 0.5) | debconf-2.0, adduser, sudo, openssl, libgstreamer1.0-0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-nice, gstreamer1.0-alsa, gstreamer1.0-tools, libglib2.0-0, libssl3, libsqlite3-0, ffmpeg, mkcert, libnss3-tools"

assets = [
  ["src/assets/openresquesim.desktop", "usr/share/applications/openresquesim.desktop", "644"],
  ["src/assets/icons/openresquesim.svg", "usr/share/icons/hicolor/scalable/apps/openresquesim.svg", "644"],
  ["src/web/index.html", "usr/share/openresquesim/web/index.html", "644"],
  ["src/web/frontend/templates/**/*", "usr/share/openresquesim/web/frontend/templates", "644"],
  ["src/web/frontend/static/**/*", "usr/share/openresquesim/web/frontend/static", "755"],
  ["src/web/frontend/help/**/*", "usr/share/openresquesim/web/frontend/help", "644"],
  ["scripts/install_runtime_deps.sh", "usr/share/openresquesim/scripts/install_runtime_deps.sh", "755"],
  ["scripts/first_start.sh", "usr/share/openresquesim/scripts/first_start.sh", "755"],
  ["scripts/setup_https.sh", "usr/share/openresquesim/scripts/setup_https.sh", "755"],
  ["scripts/install_update.sh", "usr/share/openresquesim/scripts/install_update.sh", "755"],
  ["debian/openresquesim.service", "usr/lib/systemd/system/openresquesim.service", "644"],
  ["scripts/sudoers.openresquesim", "etc/sudoers.d/openresquesim", "440"],
  ["Installscript.md", "usr/share/openresquesim/doc/Installscript.md", "644"],
  ["THIRD_PARTY_NOTICES.md", "usr/share/openresquesim/doc/THIRD_PARTY_NOTICES.md", "644"]
]


[dependencies]
libc = "0.2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
axum = { version = "0.6", features = ["ws", "headers", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer = "0.21"
gstreamer-net = "0.21"
gstreamer-video = "0.21"
gstreamer-audio = "0.21"
gstreamer-webrtc = "0.21"
gstreamer-sdp = "0.21"

sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
bytes = "1"

# Auth
argon2 = { version = "0.5", features = ["password-hash"] }
password-hash = "0.5"
jsonwebtoken = "9"
rand_core = "0.6"
async-trait = "0.1"




# Datenbank
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls" , "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.4", features = ["fs", "cors"] }
# HTTPS-Listener (optional, ORS_TLS_CERT/ORS_TLS_KEY)
axum-server = { version = "0.5", features = ["tls-rustls"] }
anyhow = "1"
futures-util = "0.3"
futures = "0.3"

# GUI
eframe = "0.27"
egui = "0.27"      # optional, eframe re-exportiert egui, schadet aber nicht
tungstenite = "0.20"
url = "2"
crossbeam-channel = "0.5"
ureq = { version = "2.9", features = ["json"] }
glib = "0.18"
urlencoding = "2"
qrcode = "0.13"
local-ip-address = "0.6"

dirs = "5"
tera = "1"
minijinja = { version = "2", features = ["loader"] }
once_cell = "1"
