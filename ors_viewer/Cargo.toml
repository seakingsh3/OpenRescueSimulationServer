[package]
name = "ors_viewer"
version = "0.1.0"
edition = "2024"

[features]
default = ["viewer", "audio", "ffmpeg"]
viewer = []
audio = ["cpal"]
ffmpeg = [
  "ffmpeg-next/build",             # bundled compile (vermeidet System-Mismatches)
  "ffmpeg-next/codec",             # libavcodec
  "ffmpeg-next/format",            # libavformat (wird intern referenziert)
  "ffmpeg-next/software-scaling",  # libswscale
  # (später für Audio: "ffmpeg-next/software-resampling")
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread","macros","net","time","sync","io-util"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version="0.3", features=["env-filter"] }
anyhow = "1"

# Audio + Video Fenster
cpal = { version = "0.15", optional = true }
winit = "0.28"
pixels = "0.13"

# optional FFmpeg-Backend (dyn link -> .so im Bundle)
ffmpeg-next = { version = "6", optional = true, default-features = false }
